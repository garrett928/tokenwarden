version: '3'

vars:
  BIN_DIR: bin

tasks:
  build:
    desc: Build all binaries into ./bin
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/tokenwardend ./cmd/tokenwardend
      - go build -o {{.BIN_DIR}}/tokenwarden ./cmd/tokenwarden
      - go build -o {{.BIN_DIR}}/twprobe ./cmd/twprobe

  test:
    desc: Run the full test suite with the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Vet and lint
    cmds:
      - go vet ./...
      - '{{if .GOLANGCI}}golangci-lint run{{else}}echo "golangci-lint not installed, skipping (go vet ran)"{{end}}'
    vars:
      GOLANGCI:
        sh: command -v golangci-lint || true

  run:
    desc: Build and run the daemon in the foreground
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/tokenwardend

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  clean:
    desc: Remove build output
    cmds:
      - rm -rf {{.BIN_DIR}}

  ui:install:
    desc: Install UI dependencies
    dir: ui
    cmds:
      - npm install

  ui:dev:
    desc: Run the UI dev server (proxies /api to a running daemon on 127.0.0.1:7842)
    dir: ui
    cmds:
      - npm run dev

  ui:build:
    desc: Build the UI for production (output ui/dist, served by the daemon if present)
    dir: ui
    cmds:
      - npm run build

  ui:lint:
    desc: Lint/typecheck the UI
    dir: ui
    cmds:
      - npm run lint

  build:all:
    desc: Build Go binaries and the UI (requires Node — plain `build` stays Go-only)
    cmds:
      - task: build
      - task: ui:build
