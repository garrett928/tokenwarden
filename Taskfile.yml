version: '3'

vars:
  BIN_DIR: bin

tasks:
  build:
    desc: Build all binaries into ./bin
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/tokenwardend ./cmd/tokenwardend
      - go build -o {{.BIN_DIR}}/tokenwarden ./cmd/tokenwarden
      - go build -o {{.BIN_DIR}}/twprobe ./cmd/twprobe

  test:
    desc: Run the full test suite with the race detector
    cmds:
      - go test -race ./...

  lint:
    desc: Vet and lint
    cmds:
      - go vet ./...
      - '{{if .GOLANGCI}}golangci-lint run{{else}}echo "golangci-lint not installed, skipping (go vet ran)"{{end}}'
    vars:
      GOLANGCI:
        sh: command -v golangci-lint || true

  run:
    desc: Build and run the daemon in the foreground
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/tokenwardend

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  clean:
    desc: Remove build output
    cmds:
      - rm -rf {{.BIN_DIR}}

  ui:check-node:
    internal: true
    dir: ui
    silent: true
    cmds:
      - |
        required=$(tr -d '[:space:]' < .nvmrc)
        current=$(node --version | sed 's/^v//' | cut -d. -f1)
        if [ "$current" -lt "$required" ]; then
          echo "error: ui/ needs Node $required+ (see ui/.nvmrc); active node is $(node --version)." >&2
          echo "       If you use nvm: run 'nvm use' inside ui/, or 'nvm install' if it's not installed yet." >&2
          exit 1
        fi

  ui:install:
    desc: Install UI dependencies
    dir: ui
    deps: [ui:check-node]
    cmds:
      - npm install

  ui:dev:
    desc: Run the UI dev server (proxies /api to a running daemon on 127.0.0.1:7842)
    dir: ui
    deps: [ui:check-node]
    cmds:
      - npm run dev

  ui:build:
    desc: Build the UI for production (output ui/dist, served by the daemon if present)
    dir: ui
    deps: [ui:check-node]
    cmds:
      - npm run build

  ui:lint:
    desc: Lint/typecheck the UI
    dir: ui
    deps: [ui:check-node]
    cmds:
      - npm run lint

  build:all:
    desc: Build Go binaries and the UI (requires Node — plain `build` stays Go-only)
    cmds:
      - task: build
      - task: ui:build

  desktop:dev:
    desc: Run the native desktop shell against a freshly built daemon (requires Node + a C toolchain — see desktop/go.mod, kept isolated from the root module on purpose)
    deps: [build]
    dir: desktop
    cmds:
      - go run .

  desktop:build:
    desc: Build a real .app bundle for the desktop shell (macOS host required for a macOS build)
    deps: [build]
    dir: desktop
    cmds:
      - wails3 package
