name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build all binaries
        run: |
          mkdir -p bin
          go build -o bin/ ./cmd/tokenwardend
          go build -o bin/ ./cmd/tokenwarden
          go build -o bin/ ./cmd/twprobe

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  desktop-cross-platform:
    # Proves the desktop/ module (see CLAUDE.md — its own Go module,
    # deliberately isolated from the root module's no-cgo constraint since
    # Wails needs cgo) actually compiles on Linux and Windows, not just the
    # macOS this repo has so far only verified by hand. This is a build
    # check only — real packaging (.app/.exe/AppImage) and a release
    # pipeline for those platforms are a later step; see CLAUDE.md's
    # desktop/ entry for what's still open.
    strategy:
      fail-fast: false # so one platform's failure doesn't hide the others' results
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc

      # Wails v3 defaults to the GTK4 + WebKitGTK 6.0 stack on Linux, which
      # is still experimental (per Wails' own docs) even on a distro new
      # enough to have it. -tags gtk3 below switches to the older, stable
      # GTK3 + WebKit2GTK 4.1 backend instead — these are the matching
      # apt packages for it. (Found by letting this job fail once and
      # reading the actual pkg-config error — Wails' own dependency docs
      # describe the gtk3/gtk4 split, but don't make "you must also pass
      # -tags gtk3 to go build/vet, not just install the gtk3 packages"
      # obvious up front.)
      - name: Install Linux GUI toolkit dependencies (GTK3 + WebKit2GTK 4.1 backend)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the desktop shell's placeholder frontend
        run: npm ci && npm run build
        working-directory: desktop/frontend

      - name: Vet and build desktop/ (its own module, not part of the root ./...)
        working-directory: desktop
        env:
          GOFLAGS: ${{ runner.os == 'Linux' && '-tags=gtk3' || '' }}
        run: |
          go vet ./...
          go build ./...

  cross-compile:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile (proves no-cgo constraint holds)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p bin
          go build -o bin/ ./cmd/tokenwardend
          go build -o bin/ ./cmd/tokenwarden
          go build -o bin/ ./cmd/twprobe
